site_name: '@juli-os/silo'
docs_dir: docs
strict: true
theme:
  name: material
  language: zh
  features:
    - navigation.top
    - navigation.path
    - navigation.footer
    - navigation.expand
    - search.suggest
    - content.code.copy
  alternate:
    - name: 中文
      link: /
      code: zh
    - name: English
      link: /en/
      code: en
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
# 插件顺序有约束：i18n 先改写页面，literate-nav 再读 SUMMARY.md 生成 nav，反了会告警。
plugins:
  - search
  # i18n 用 suffix 模式：zh 是默认语言，页面在根路径；en 页面带 .en.md 后缀，构建到 /en/ 下。
  # 实测（2026-11-12，static-i18n 1.3.1 + literate-nav 0.6.3）：
  # - 没有 *.en.md 对应的页面（api 深页、架构页）照样构建进 /en/，内容回退为中文
  #   （fallback_to_default 默认 true），html lang 仍是 en。
  # - 两语言页面一一对应。语言切换器两个方向都指向对方的同路径页面，不会丢深页。
  # - api 深页正文由 typedoc 生成、全中文。SUMMARY 的分组名经 nav_translations 在 en 下翻成英文。
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          name: 中文
          default: true
        - locale: en
          name: English
          nav_translations:
            首页: Home
            架构: Architecture
            API 参考: API Reference
            概览: Overview
            functions: Functions
            interfaces: Interfaces
            type-aliases: Type aliases
            variables: Variables
            enums: Enums
  - literate-nav
nav:
  - 首页: index.md
  - 架构: gen/architecture.md
  # api/ 结尾的斜杠是 literate-nav 语法：该目录的 nav 由 docs/api/SUMMARY.md 提供。
  - API 参考: api/
